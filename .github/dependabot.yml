version: 2
updates:
  - package-ecosystem: composer
    directory: "/merch_shop_api"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      composer-production:
        dependency-type: production
        update-types: [minor, patch]
    # Mettre à jour la branche develop
    commit-updates:
      branch: develop
    # Ouvrir les PRs sur la branche develop
    open-pull-requests-branch: develop

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
    # Mettre à jour la branche develop
    commit-updates:
      branch: develop
    # Ouvrir les PRs sur la branche develop
    open-pull-requests-branch: develop