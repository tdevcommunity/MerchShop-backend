# Detection des vulnerabilites du backend Laravel.
#
# Jobs :
#  - composer-audit   : audite composer.lock (bloque sur toute vulnerabilite) ;
#  - trivy-fs         : secrets, erreurs de configuration, dependances (SARIF) ;
#  - trivy-image      : vulnerabilites de l'image Docker de production.
#                       Le rapport couvre toutes les severites, mais seules
#                       les failles HIGH/CRITICAL *corrigeables* bloquent.
#
# CodeQL ne supporte pas PHP : l'analyse statique du code PHP n'est donc pas
# couverte ici. Les resultats SARIF remontent dans Security > Code scanning.
# Aucune correction automatique : quand une vulnerabilite est detectee, le job
# echoue et la liste des paquets concernes apparait dans le resume du job. La
# correction et le commit restent manuels.
# Les simples mises a jour de version sont listees par le workflow Dependencies.

name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  composer-audit:
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Auditer les dependances
        working-directory: merch_shop_api
        run: |
          set +e
          composer audit --locked --format=json > composer-audit.json
          status=$?
          set -e
          node ../.github/scripts/composer-audit-summary.mjs composer-audit.json
          if [ "$status" -ne 0 ] && [ ! -s composer-audit.json ]; then
            echo "::error::composer audit n'a pas pu produire de rapport."
            exit "$status"
          fi

  trivy-fs:
    name: Trivy (fichiers, secrets, config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Scan SARIF (bloquant)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: merch_shop_api
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Scan lisible
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: merch_shop_api
          scanners: vuln,secret,misconfig
          format: table
          output: trivy-fs.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Ajouter le rapport au resume du job
        if: always() && hashFiles('trivy-fs.txt') != ''
        run: |
          {
            echo "### Trivy - dependances, secrets et configuration"
            echo '```'
            cat trivy-fs.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport dans Code scanning
        if: always() && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  trivy-image:
    name: Trivy (image Docker)
    # Pas de build d'image sur les PR : le workflow Deploy la construit deja
    # au merge. Le scan tourne sur main/develop, chaque semaine et a la demande.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Construire l'image de production
        run: |
          docker build \
            -f merch_shop_api/Dockerfile.production \
            -t merchshop-backend:scan \
            merch_shop_api

      # Rapport complet, sans blocage : toutes les severites remontent dans
      # Security > Code scanning, y compris celles que Debian ou les binaires
      # embarques (FrankenPHP, PHP) n'ont pas encore corrigees.
      - name: Scan SARIF (informatif)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-backend:scan
          format: sarif
          output: trivy-image.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Scan lisible
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-backend:scan
          format: table
          output: trivy-image.txt
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      # Seul blocage : une faille HIGH/CRITICAL pour laquelle un correctif
      # existe. Une CVE sans version corrigee ne peut pas etre traitee par une
      # mise a jour, elle ne doit donc pas rendre le job rouge.
      - name: Gate bloquant (HIGH/CRITICAL corrigeables)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: merchshop-backend:scan
          format: table
          output: trivy-image-gate.txt
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Ajouter le rapport au resume du job
        if: always() && hashFiles('trivy-image.txt') != ''
        run: |
          {
            echo "### Trivy - image Docker"
            echo
            echo "Rapport complet (toutes severites, non bloquant) :"
            echo '```'
            cat trivy-image.txt
            echo '```'
            if [ -s trivy-image-gate.txt ]; then
              echo
              echo "Gate bloquant - HIGH/CRITICAL avec correctif :"
              echo '```'
              cat trivy-image-gate.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier le rapport dans Code scanning
        if: always() && hashFiles('trivy-image.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
