# Deploiement continu sur le VPS (shop-api.ourtdev.com) a chaque push sur main.
#
# Aucun secret GitHub n'est necessaire :
#  - l'image est poussee sur GHCR avec le GITHUB_TOKEN fourni par Actions ;
#  - le VPS est declenche avec un jeton OIDC signe par GitHub, que le service
#    de deploiement verifie (depot, branche main). Les secrets applicatifs
#    restent sur le VPS.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/abp01/merchshop-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: merch_shop_api
          file: merch_shop_api/Dockerfile.production
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Declencher le deploiement sur le VPS
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://deploy.ourtdev.com" | jq -r .value)
          echo "::add-mask::$token"
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 600 \
            -X POST -H "Authorization: Bearer $token" https://deploy.ourtdev.com/deploy)
          cat response.json; echo
          test "$status" = "200"
